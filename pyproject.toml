[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freedos_micro_python"
version = "0.1.5"
description = "MicroPython port for FreeDOS / i386 — built end-to-end through the uc386 C23 compiler"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    # TEMPORARY: this wants to be >=0.1.5, and should be raised back the
    # moment uc386 0.1.5 reaches PyPI.
    #
    # 0.1.5 is the first release whose DOS libc issues real INT 21h
    # AH=0x3D / AH=0x3C for open and create. Earlier versions call
    # dos_emu's private AH=0xA0, which does not exist on real DOS, so an
    # MP.EXE built against them misbehaves in os.stat / os.path.* /
    # shutil on hardware. The uc386 0.1.5 release exists on GitHub but
    # its PyPI publish never ran (GitHub Actions major outage,
    # 2026-08-06), so pinning >=0.1.5 here would make this package
    # unresolvable from PyPI.
    "uc386>=0.1.4",
]
authors = [
    {name = "freedos_micro_python contributors"}
]
keywords = [
    "micropython", "python", "freedos", "dos", "i386",
    "retro-computing", "embedded", "interpreter"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Compilers",
    "Topic :: System :: Emulators",
]

[project.urls]
Homepage = "https://github.com/avwohl/freedos_micro_python"
Repository = "https://github.com/avwohl/freedos_micro_python"
Issues = "https://github.com/avwohl/freedos_micro_python/issues"

[project.scripts]
freedos-micropython = "freedos_micro_python.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
freedos_micro_python = [
    "scripts/*.sh",
    "port/*.c",
    "port/*.h",
    "port/arch/*.h",
    "port/lib/**/*.h",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
