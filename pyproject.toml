[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freedos_micro_python"
version = "0.2.0"
description = "MicroPython port for FreeDOS / i386 — built end-to-end through the uc386 C23 compiler"
readme = "README.md"
license = "MIT"
# 3.11, not 3.10, and the floor is inherited rather than chosen: our own
# code is 3.10-clean, but uc386 declares requires-python >=3.11 (itself
# forced by uplox, transitively via uc_core). Claiming 3.10 here made the
# metadata self-contradictory — pip on 3.10 resolved us fine and then
# died with "No matching distribution found for uc386>=0.2.1". CI caught
# it. If uc386 ever lowers its floor, this can follow it back down.
requires-python = ">=3.11"
dependencies = [
    # 0.2.1 is the floor, not a preference. Two independent reasons:
    #
    #  - 0.1.5 was the first release whose DOS libc issues real INT 21h
    #    AH=0x3D / AH=0x3C for open and create. Earlier versions call
    #    dos_emu's private AH=0xA0, which does not exist on real DOS, so
    #    an MP.EXE built against them misbehaves in os.stat /
    #    os.path.* / shutil on hardware.
    #  - 0.2.1 is the first release whose dos_emu can run this port at
    #    all. Before it, the emulator executed our DPMI real-mode-call
    #    bridge natively, which poisons unicorn's stack width, and every
    #    run died at the same instruction — 104 of our smoke tests
    #    failed identically. See docs/WIP.md.
    "uc386>=0.2.1",
]
authors = [
    {name = "freedos_micro_python contributors"}
]
keywords = [
    "micropython", "python", "freedos", "dos", "i386",
    "retro-computing", "embedded", "interpreter"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Compilers",
    "Topic :: System :: Emulators",
]

[project.urls]
Homepage = "https://github.com/avwohl/freedos_micro_python"
Repository = "https://github.com/avwohl/freedos_micro_python"
Issues = "https://github.com/avwohl/freedos_micro_python/issues"

[project.scripts]
freedos-micropython = "freedos_micro_python.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
freedos_micro_python = [
    "scripts/*.sh",
    "port/*.c",
    "port/*.h",
    "port/arch/*.h",
    "port/lib/**/*.h",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
