# DOSBox-X config for the uc386-MicroPython network test rig.
#
# Boots into a stock DOSBox-X DOS shell with NE2000 emulation
# pointed at the SLIRP backend (no host-network privileges
# required). The autoexec.bat in this directory handles loading
# the Crynwr ne2000 packet driver and running mp.exe.
#
# Net layout under SLIRP — matches dos_emu_netsim.NetworkSimulator
# defaults exactly, so the binary's expected lease (10.0.2.15) is
# the same in both environments:
#   network: 10.0.2.0/24
#   host  :  10.0.2.2  (gateway)
#   dns   :  10.0.2.3
#   guest :  10.0.2.15 (assigned via DHCP)

[sdl]
fullscreen     = false
output         = surface
autolock       = false
windowposition = 80,40

[render]
aspect         = false

[cpu]
# `core=normal` matches what exe-smoke.yml uses for the regular
# DOSBox 0.74-3 path that successfully runs echo.exe / factor.exe
# / argv_probe.exe under PMODE/W. The dynamic core has stale
# code-cache races for some PMODE/W workloads — known-good first.
cputype        = pentium
core           = normal
cycles         = max

[dosbox]
# Big enough for the binary's 1 MB libc heap + MicroPython's 256 KB
# static heap + DOS overhead.
memsize        = 16

[ne2000]
# Crynwr ne2000.com expects to find the card at IO 0x300 / IRQ 9.
# Match those here. nicirq=9 dovetails with the Crynwr default
# command line `ne2000 0x60 9 0x300` in autoexec.bat.
ne2000         = true
nicbase        = 0x300
nicirq         = 9
backend        = slirp

[ethernet, slirp]
ipv4_network    = 10.0.2.0
ipv4_netmask    = 255.255.255.0
ipv4_host       = 10.0.2.2
ipv4_nameserver = 10.0.2.3
ipv4_dhcp_start = 10.0.2.15

[autoexec]
# `mount C` makes this directory the C: drive so MP.EXE +
# NE2000.COM are available without any additional path setup.
mount C .
C:
call autoexec.bat
