# DOSBox-X config for the bigint-bench rig. Same shape as
# rigs/dosbox-x-rig/dosbox-x.conf but tuned for our standalone
# bench: we run BIGINT.EXE under DOS/32A (not PMODE/W), so the
# dynamic core's prior PMODE/W code-cache races don't apply — we
# can safely turn it on and measure JIT-accelerated throughput.

[sdl]
output         = surface
nomenu         = true
autolock       = false
fullscreen     = false

[cpu]
# Dynamic core: x86 JIT. Significantly faster than the interpreted
# `normal` core on tight numerical loops, which is exactly what
# the bench measures.
cputype        = pentium
core           = dynamic_x86
cycles         = max

[dosbox]
memsize        = 16

[autoexec]
mount c: .
c:
BIGINT.EXE > RIG.LOG
echo --- rig done --- >> RIG.LOG
exit
