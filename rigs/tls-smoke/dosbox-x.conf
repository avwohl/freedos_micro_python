# DOSBox-X config for the tls-smoke rig under the dynamic core.
#
# Same NE2000 + SLIRP layout as rigs/dosbox-x-rig/dosbox-x.conf,
# but with `core=dynamic_x86` enabled. The bigint-bench rig showed
# the codegen-fix series buys ~29% throughput on DOSBox-X dynamic
# (vs +5% on QEMU TCG-on-ARM); the open question this rig answers
# is whether that 29% is enough to land the RSA-2048 modexp inside
# the rig's 10-minute budget.
#
# The dynamic core is safe for our TLS.EXE because it runs under
# DOS/32A (not PMODE/W — the existing dosbox-x-rig avoids dynamic
# because of stale code-cache races specific to PMODE/W's INT 0x60
# patching).

[sdl]
fullscreen     = false
output         = surface
autolock       = false

[render]
aspect         = false

[cpu]
cputype        = pentium
core           = dynamic_x86
cycles         = max

[dosbox]
# Smoke .EXE is ~200 KB and uses lwIP's pbuf pool + axtls bigint
# state; 16 MB is plenty.
memsize        = 16

[ne2000]
ne2000         = true
nicbase        = 0x300
nicirq         = 9
backend        = slirp

[ethernet, slirp]
ipv4_network    = 10.0.2.0
ipv4_netmask    = 255.255.255.0
ipv4_host       = 10.0.2.2
ipv4_nameserver = 10.0.2.3
ipv4_dhcp_start = 10.0.2.15

[autoexec]
mount C .
C:
TLS.EXE > RIG.LOG
echo --- rig done --- >> RIG.LOG
exit
